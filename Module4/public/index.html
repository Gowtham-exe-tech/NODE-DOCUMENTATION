<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MongoCart</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><small>MODULE 4 / MONGODB</small><h1>MongoCart</h1><p>Small e-commerce dashboard for learning Mongoose relationships and transactions.</p><span id="status">Checking API...</span></header><section class="grid"><article class="panel"><div class="row"><h2>Products</h2><button id="refreshProducts">Refresh</button></div><div id="products" class="products"></div></article><aside class="panel"><small>ORDER FLOW</small><h2>Create order</h2><p>Stock reduction and order creation happen in one MongoDB transaction.</p><label>User ID</label><input id="userId" placeholder="Paste seed user id"><label>Product</label><select id="product"></select><label>Quantity</label><input id="quantity" type="number" min="1" value="1"><button id="placeOrder">Place order</button><pre id="result">No order yet.</pre></aside></section><section class="panel"><div class="row"><h2>Recent orders</h2><button id="refreshOrders">Refresh</button></div><div id="orders"></div></section></main><script src="/app.js"></script></body></html>
